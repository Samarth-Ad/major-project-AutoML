[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "major-project-automl"
version = "0.2.0"
description = "Research CLI and experiment sweeps for meta-feature-guided LLM AutoML. Depends on automl-reusables."
requires-python = ">=3.11"
dependencies = [
    "automl-reusables @ git+https://github.com/Major-Proj-AutoML/automl-reusables.git@main",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["."]
include = []
exclude = ["src*", "tests*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
