[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "major-project"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pandas",
    "numpy",
    "scikit-learn",
    "scipy",
    "tabulate",
    "requests",
    "openml",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
