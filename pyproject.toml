[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "major-project"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "scikit-learn",
    "scipy",
    "openml",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
