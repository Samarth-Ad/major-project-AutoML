# =============================================================================
# Agentic Pipeline Builder — Configuration
# =============================================================================
# Steps are NO LONGER listed here.
# They are decided at runtime by DataUnderstandingAgent based on your data.
# Only settings live in this file.
# =============================================================================

pipeline:
  name: "Adaptive ML Pipeline"
  description: "Fully adaptive — steps chosen based on actual data characteristics"
  version: "2.0"

# ── LLM Settings ─────────────────────────────────────────────────────────
llm:
  backend:         "ollama"
  ollama_model:    "gpt-oss:120b-cloud"
  ollama_base_url: "http://localhost:11434"
  anthropic_model: "claude-sonnet-4-20250514"
  max_retries:     3
  abort_on_failure: true

# ── Data Settings ─────────────────────────────────────────────────────────
data:
  filepath:      ""            # leave empty to auto-generate synthetic data
  target_column: ""            # leave empty to auto-infer from data

# ── Adaptive Step Thresholds ──────────────────────────────────────────────
# These control WHEN a step is triggered automatically.
# You can tune them without touching any Python code.
thresholds:
  null_pct_to_trigger_imputation:    0.0    # any nulls → run missing value step
  imbalance_ratio_to_trigger_smote:  0.25   # minority < 25% → run SMOTE
  skewness_to_trigger_correction:    1.0    # |skew| > 1.0 → run skewness fix
  features_to_trigger_pca:           50     # cols after encoding > 50 → run PCA
  rows_to_trigger_tuning:            500    # rows > 500 → run hyperparameter tuning